[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdo-demo"
version = "0.1.0"
description = "Reproducible AeroTransformer evaluation and CFD truth-check workbench"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
mdo-demo = "mdo_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
